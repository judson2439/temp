[build]
  publish = "dist"
  command = "npm run build"

# IMPORTANT: Specific routes MUST come before the catch-all rule
# Serve static payment-success.html for Stripe redirect
[[redirects]]
  from = "/payment-success"
  to = "/payment-success.html"
  status = 200

# SPA fallback - serve index.html for all other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
